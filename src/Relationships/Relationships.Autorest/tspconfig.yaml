options:
  "@azure-tools/typespec-powershell":
    service-dir: "src"
    emitter-output-dir: "{output-dir}/{service-dir}/Relationships/Relationships.Autorest"
    clear-output-folder: true
    azure: true
    module-version: 0.2.0
    prefix: "Az"
    subject-prefix: "Relationships"
    service-name: "Relationships"
    module-name: "{prefix}.{service-name}"
    output-folder: "{output-dir}"
    exclude-tableview-properties:
      - Id
      - Type
    directive:
      # Hide the Operations endpoint from public interface
      - where:
          subject: Operation
        hide: true
      # Default SubscriptionId to current context
      - where:
          parameter-name: SubscriptionId
        set:
          default:
            script: "(Get-AzContext).Subscription.Id"
      # Remove unexpanded parameter sets for Create/Update
      - where:
          variant: ^(Create|Update)(?!.*?(Expanded|ViaJsonString|ViaJsonFilePath))
        remove: true
      # Remove ViaIdentity Create variants
      - where:
          variant: ^CreateViaIdentity$|^CreateViaIdentityExpanded$
        remove: true
      # Remove Set-* cmdlets
      - where:
          verb: Set
        remove: true

# The PowerShell generation environment pins an older Azure ruleset package that
# does not contain client-sdk. API linting is performed in azure-rest-api-specs.
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
