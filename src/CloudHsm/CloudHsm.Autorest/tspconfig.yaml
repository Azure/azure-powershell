options:
  "@azure-tools/typespec-powershell":
    service-dir: "src"
    emitter-output-dir: "{output-dir}/{service-dir}/CloudHsm/CloudHsm.Autorest"
    clear-output-folder: true
    azure: true
    module-version: 0.1.0
    prefix: "Az"
    subject-prefix: "CloudHsm"
    service-name: CloudHsm
    module-name: "{prefix}.{service-name}"
    output-folder: "{output-dir}"
    exclude-tableview-properties:
      - Id
      - Type
    directive:
      - no-inline:
          - Error
      - where:
          subject: Operation
        hide: true
      - where:
          parameter-name: SubscriptionId
        set:
          default:
            script: "(Get-AzContext).Subscription.Id"

      # Remove the unexpanded / ViaIdentity / ViaJson variants
      - where:
          variant: ^(Create|Update)(?!.*?(Expanded))
        remove: true
      - where:
          variant: ^CreateViaIdentity$|^CreateViaIdentityExpanded$|^UpdateViaIdentityExpanded$|^CreateViaJsonString$|^CreateViaJsonFilePath$
        remove: true
      - where:
          variant: ^(Backup|BackupViaIdentityExpanded|Restore|RestoreViaIdentityExpanded|GetViaIdentity|DeleteViaIdentity)(?!.*?(Expanded))
        remove: true

      # Remove the Set-* cmdlets
      - where:
          verb: Set
        remove: true

      # Remove the auto-generated Private Endpoint cmdlets
      - where:
          subject: PrivateEndpointConnection|PrivateLinkResource
        remove: true
      - where:
          verb: Test
        remove: true

      # Hide parameters the service does not support
      - where:
          parameter-name: SkuCapacity|EnableSystemAssignedIdentity|PublicNetworkAccess|Token
        hide: true

      # Rename CloudHsmClusterName parameter to Name
      - where:
          parameter-name: CloudHsmClusterName
        set:
          parameter-name: Name

      # Hide the generated cmdlets; the public surface comes from custom/*.ps1
      - where:
          verb: ^New$|^Update$|^Get$|^Backup$|^Restore$|^Remove$
        hide: true

      # Make Sku required with a default for New-AzCloudHsm
      - where:
          verb: ^New$
          parameter-name: SkuName
          required: true
        set:
          parameter-name: Sku
          default:
            script: '"Standard_B1"'

      # Drop the 'Cluster' part of the subject, e.g. New-AzCloudHsmCluster -> New-AzCloudHsm
      - where:
          verb: ^Backup$|^Restore$|^New$|^Update$|^Remove$
          subject: ''
        set:
          subject-prefix: ''
          subject: CloudHsm
      - where:
          verb: ^Backup$|^Restore$
          parameter-name: Name
        set:
          parameter-name: ClusterName
      - where:
          verb: ^Backup$|^Restore$
          subject: ''
          parameter-name: Name
        set:
          parameter-name: SkuName
      - where:
          verb: ^Backup$|^Restore$
          subject: ''
          parameter-name: AzureStorageBlobContainerUri
        set:
          parameter-name: BlobContainerUri

      # Remove the Cluster backup/restore status cmdlets
      - where:
          verb: ^Get$
          subject: CloudHsmClusterBackupStatus
        remove: true
      - where:
          verb: ^Get$
          subject: CloudHsmClusterRestoreStatus
        remove: true

      # Get-AzCloudHsmCluster -> Get-AzCloudHsm
      - where:
          verb: ^Get$
          subject: CloudHsmCluster
        set:
          subject-prefix: ''
          subject: CloudHsm

      - where:
          parameter-name: SkuName
        set:
          parameter-name: Sku

      - where:
          verb: Update
          parameter-name: AutoGeneratedDomainNameLabelScope
        hide: true
      - where:
          parameter-name: AutoGeneratedDomainNameLabelScope
        set:
          parameter-name: DomainNameLabelScope

# Remove this once the spec repo drops that rule set.
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"